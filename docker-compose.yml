name: phoenix

# The Node image, built once from the Dockerfile and shared by every app service.
x-app: &app
  build: .
  image: phoenix-app:dev
  init: true # forwards SIGTERM to node, so `docker compose stop` is instant
  environment:
    # Inside the compose network Postgres is reachable as "postgres", not localhost.
    DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    # The fake LLM unless .env says otherwise (e.g. https://openrouter.ai/api/v1).
    LLM_BASE_URL: ${LLM_BASE_URL:-http://fake-llm:9001/v1}
    LLM_API_KEY: ${LLM_API_KEY:-fake}
    LLM_MODEL: ${LLM_MODEL:-fake}

services:
  postgres:
    image: postgres:16.16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set it in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set it in .env}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      # Tasks must survive container restarts and `down`; only db:reset wipes this.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # "Container started" is not "accepting connections".
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  # One-shot: applies migrations, then exits 0. App services wait for that exit.
  migrate:
    <<: *app
    command: ["node", "dist/src/migrate.js"]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app
    command: ["node", "dist/src/api.js"]
    ports: ["8000:8000"]
    depends_on: &after-migrate
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *app
    command: ["node", "dist/src/worker.js"]
    deploy: { replicas: 3 }
    depends_on: *after-migrate

  dispatcher:
    <<: *app
    command: ["node", "dist/src/dispatcher.js"]
    depends_on: *after-migrate

  fake-llm:
    <<: *app
    command: ["node", "dist/testing/fake-llm.js"]
    environment: { FAKE_LLM_PORT: 9001, FAKE_LLM_LATENCY_MS: "${FAKE_LLM_LATENCY_MS:-0}" }
    ports: ["9001:9001"]

volumes:
  pgdata:
